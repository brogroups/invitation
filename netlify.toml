# Netlify — static site, no build step
[build]
  publish = "."

# Page: always revalidate, so guests see updates immediately
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Music, fonts, images: cached for a year
# (when replacing a file, give it a new name)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
